mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: ":9090"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
geox-url:
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24
profile:
  store-selected: true
  store-fake-ip: true
find-process-mode: strict
global-client-fingerprint: chrome
tcp-concurrent: true
unified-delay: true

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [ 443, 8443 ]
    HTTP:
      ports: [ 80, 8080-8880 ]
      override-destination: true
    QUIC:
      ports: [ 443, 8443 ]
  force-domain:
    - +.v2ex.com
    - www.google.com
    - google.com
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.apple.com
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
dns:
  enable: true
  prefer-h3: true
  ipv6: true
  listen: 0.0.0.0:53
  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  fake-ip-filter: [ 'rule-set:fakeip-filter,private,cn', '111.198.46.148' ]
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
proxies: [ ]
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Best
      - Fallback
      - Select
      - HK
      - TW
      - JP
      - SG
      - US
  - name: Select
    type: select
    filter: ".*"
    proxies: [ ]
  - name: Best
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    lazy: true
    timeout: 2000
    interval: 600
    tolerance: 50
    filter: "_Gemini_Claude"
    proxies: [ ]
  - name: Fallback
    type: fallback
    url: https://www.google.com/generate_204
    expected-status: 204
    lazy: true
    timeout: 2000
    interval: 600
    tolerance: 50
    filter: ".*"
    proxies: [ ]
  - name: HK
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    lazy: true
    timeout: 2000
    interval: 600
    tolerance: 50
    proxies: [ ]
    filter: "(?i)港|HK|HongKong|hong kong"
  - name: TW
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    lazy: true
    timeout: 2000
    interval: 600
    tolerance: 50
    proxies: [ ]
    filter: "台湾|TW|Tw|Taiwan|新北|彰化|CHT|HINET"
  - name: JP
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    lazy: true
    timeout: 2000
    interval: 600
    tolerance: 50
    proxies: [ ]
    filter: "(?i)日|东京|大阪|JP|Japan|Tokyo|Osaka|Saitama"
  - name: SG
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    lazy: true
    timeout: 2000
    interval: 600
    tolerance: 50
    proxies: [ ]
    filter: "(?i)新|狮城|SG|Singapore"
  - name: US
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    lazy: true
    timeout: 2000
    interval: 600
    tolerance: 50
    proxies: [ ]
    filter: "(?i)美|洛杉矶|芝加哥|西雅图|America|US|United.*?States"
  - name: Claude
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    timeout: 2000
    interval: 600
    tolerance: 50
    proxies: [ PROXY ]
    filter: "_Claude"
  - name: Gemini
    type: url-test
    url: https://www.google.com/generate_204
    expected-status: 204
    timeout: 2000
    interval: 600
    tolerance: 50
    proxies: [ PROXY ]
    filter: "_Gemini"
rules:
  - RULE-SET,ads,REJECT
  - DOMAIN-SUFFIX,boundaryx.net,DIRECT
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,games-cn,DIRECT
  - RULE-SET,google-cn,DIRECT
  - RULE-SET,bilibili,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,claude,Claude
  - RULE-SET,gemini,Gemini
  - RULE-SET,youtube,PROXY
  - RULE-SET,telegramip,PROXY,no-resolve
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,cnip,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,PROXY

